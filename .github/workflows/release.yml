name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: nodus-release
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: pnpm run check
      - run: pnpm test
      - name: Build macOS arm64
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac dmg --arm64 --publish never
      - name: Build Windows x64
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Build Linux x64
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --linux AppImage --x64 --publish never
      - run: node scripts/verify-package.mjs ${{ matrix.platform }}
      - name: Verify Windows installation and removal
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          ./tests/windows-uninstall.ps1 -InstallerPath "dist/Nodus-v${version}-Windows-x64.exe" -UpgradeFromPublished
      - name: Prepare versioned packages and compatibility aliases
        run: node scripts/prepare-release-asset.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Validate files and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test -s "release-assets/Nodus-v${version}-macOS-arm64.dmg"
          test -s "release-assets/Nodus-v${version}-Windows-x64.exe"
          test -s "release-assets/Nodus-v${version}-Linux-x86_64.AppImage"
          test -s release-assets/latest.yml
          test -s release-assets/latest-linux.yml
          test -s "release-assets/Nodus-v${version}-Linux-install.sh"
          cmp "release-assets/Nodus-v${version}-Linux-install.sh" release-assets/Nodus-linux-install.sh
          bash -n "release-assets/Nodus-v${version}-Linux-install.sh"
          grep -F "Nodus-v${version}-Windows-x64.exe" release-assets/latest.yml
          grep -F "Nodus-v${version}-Linux-x86_64.AppImage" release-assets/latest-linux.yml
          grep -q 'sha512:' release-assets/latest.yml
          grep -q 'sha512:' release-assets/latest-linux.yml
          cmp "release-assets/Nodus-v${version}-macOS-arm64.dmg" release-assets/Nodus-mac-arm64.dmg
          cmp "release-assets/Nodus-v${version}-Windows-x64.exe" release-assets/Nodus-windows-x64.exe
          cmp "release-assets/Nodus-v${version}-Linux-x86_64.AppImage" release-assets/Nodus-linux-x64.AppImage
          node scripts/verify-update-metadata.mjs
          (cd release-assets && sha256sum "Nodus-v${version}-macOS-arm64.dmg" "Nodus-v${version}-Windows-x64.exe" "Nodus-v${version}-Linux-x86_64.AppImage" "Nodus-v${version}-Linux-install.sh" Nodus-mac-arm64.dmg Nodus-windows-x64.exe Nodus-linux-x64.AppImage Nodus-linux-install.sh > SHA256SUMS.txt)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "v$version" release-assets/* --target "$GITHUB_SHA" --title "Nodus v$version" --notes-file "docs/releases/v$version.md" --draft
          gh release edit "v$version" --draft=false --latest
