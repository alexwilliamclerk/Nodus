name: Installed binary smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/installed-binary-smoke.yml'
      - '.github/scripts/installed-binary-smoke.mjs'
      - '.github/scripts/installed-delivery-check.mjs'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and verify official installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'Nodus-v1.6.3-Windows-x64.exe'
          $url = 'https://github.com/alexwilliamclerk/Nodus/releases/download/v1.6.3/Nodus-v1.6.3-Windows-x64.exe'
          curl.exe --fail --location --max-time 1800 $url -o $installer
          if ($LASTEXITCODE -ne 0) { throw 'Independent download failed' }
          $digest = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($digest -ne 'b2e6ade0d488d88ff1537e3a908619ea412384702daa8dbc038726b854c79e28') { throw 'Installer checksum mismatch' }
          $target = Join-Path $env:RUNNER_TEMP 'NodusInstalled'
          $install = Start-Process $installer -ArgumentList @('/S', "/D=$target") -PassThru
          if (-not $install.WaitForExit(180000)) { throw 'Installer did not exit within three minutes' }
          if ($install.ExitCode -ne 0) { throw 'Installation failed' }
          "NODUS_QA_EXE=$target\Nodus.exe" >> $env:GITHUB_ENV
          'NODUS_QA_VERSION=1.6.3' >> $env:GITHUB_ENV
      - name: Inspect installed desktop UI
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          $qa = Join-Path $env:RUNNER_TEMP 'nodus-qa'
          New-Item -ItemType Directory -Force $qa | Out-Null
          Copy-Item .github/scripts/installed-binary-smoke.mjs (Join-Path $qa 'check.mjs')
          Copy-Item .github/scripts/installed-delivery-check.mjs (Join-Path $qa 'delivery.mjs')
          Copy-Item .github/scripts/installed-onboarding-check.mjs (Join-Path $qa 'onboarding.mjs')
          Copy-Item .github/scripts/installed-images-check.mjs (Join-Path $qa 'images.mjs')
          Push-Location $qa
          npm install --no-save playwright@1.63.0
          if ($LASTEXITCODE -ne 0) { throw 'QA dependency install failed' }
          node check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed UI check failed' }
          node delivery.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed delivery check failed' }
          node onboarding.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Onboarding check failed' }
          node images.mjs
          if ($LASTEXITCODE -ne 0) { throw 'MiniMax UI check failed' }
          Pop-Location
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-windows-evidence
          path: |
            ${{ runner.temp }}/nodus-binary-evidence
            ${{ runner.temp }}/nodus-delivery-evidence-*
            ${{ runner.temp }}/nodus-onboarding-evidence-*
            ${{ runner.temp }}/nodus-images-evidence-*
          if-no-files-found: warn
          retention-days: 7
